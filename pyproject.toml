[project]
name = "jev-the-janitor"
version = "0.5.4"
description = "A janitor for markdown vaults, powered by TypeSafe Jev. Jev votes, your code files, you review the low-confidence pile."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kyle Hovance" }]
keywords = ["jev", "typesafe", "obsidian", "markdown", "vault", "memory", "system-one"]
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
jev = ["typesafe-sdk>=0.7.0"]
dev = ["pytest>=8.0", "python-frontmatter>=1.1.0"]  # python-frontmatter is a test oracle only; the janitor has its own parser

[project.scripts]
jev-janitor = "janitor.cli:main"
jev-records = "janitor.records_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["janitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
